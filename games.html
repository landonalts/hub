<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>games</title>
<link rel="stylesheet" href="./style.css" />
<script src="./app.js"></script>
</head>
<body>
<header>
  <div class="logo" onclick="location.href='./index.html'">HUB</div>
  <nav>
    <button class="nlink" onclick="location.href='./games.html'">games</button>
    <button class="nlink" onclick="location.href='./proxy.html'">proxy</button>
    <button class="nlink" onclick="location.href='./settings.html'">settings</button>
  </nav>
</header>

<div class="section">
  <input id="q" class="searchbar" placeholder="search..." autocomplete="off" />
  <p id="count" style="color:var(--faint);font-size:11px;letter-spacing:2px;margin:18px 0"></p>
  <div class="grid" id="grid"></div>
</div>

<script src="./games.js"></script>
<script src="./thumb.js"></script>
<script>
const grid = document.getElementById('grid');
const count = document.getElementById('count');
const input = document.getElementById('q');
const params = new URLSearchParams(location.search);
if (params.get('q')) input.value = params.get('q');

function render() {
  const q = input.value.trim().toLowerCase();
  grid.innerHTML = '';
  const hits = q ? GAMES.filter(g => g.title.toLowerCase().includes(q)) : GAMES;
  count.textContent = hits.length + ' games';
  const frag = document.createDocumentFragment();
  hits.slice(0, 600).forEach(g => {
    const d = document.createElement('div');
    d.className = 'card';
    const img = document.createElement('img');
    img.className = 'thumb';
    img.alt = '';
    img.loading = 'lazy';
    img.src = gameThumb(g.id, g.title);
    const t = document.createElement('div');
    t.className = 't'; t.textContent = g.title;
    d.appendChild(img); d.appendChild(t);
    d.onclick = () => location.href = './play.html?g=' + encodeURIComponent(g.id);
    frag.appendChild(d);
  });
  grid.appendChild(frag);
}
input.addEventListener('input', render);
render();
input.focus();
</script>
</body>
</html>
