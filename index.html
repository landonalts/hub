<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>hub</title>
<link rel="stylesheet" href="./style.css" />
<script src="./app.js"></script>
</head>
<body>
<header>
  <div class="logo" onclick="location.href='./index.html'">HUB</div>
  <nav>
    <button class="nlink" onclick="location.href='./games.html'">games</button>
    <button class="nlink" onclick="location.href='./proxy.html'">proxy</button>
    <button class="nlink" onclick="location.href='./settings.html'">settings</button>
  </nav>
</header>

<div class="hero">
  <h1>HUB</h1>
  <p>449 games &middot; proxy</p>
  <input id="q" class="searchbar" placeholder="search games..." autocomplete="off" />
</div>

<div class="section">
  <h2>featured</h2>
  <div class="grid" id="featured"></div>
</div>

<footer>hub</footer>

<script src="./games.js"></script>
<script>
function card(g) {
  const d = document.createElement('div');
  d.className = 'card';
  const t = document.createElement('div');
  t.className = 't'; t.textContent = g.title;
  d.appendChild(t);
  d.onclick = () => location.href = './play.html?g=' + encodeURIComponent(g.id);
  return d;
}
const picks = [3, 40, 87, 120, 165, 210, 260, 330].map(i => GAMES[i % GAMES.length]);
const feat = document.getElementById('featured');
picks.forEach(g => feat.appendChild(card(g)));
const q = document.getElementById('q');
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && q.value.trim()) location.href = './games.html?q=' + encodeURIComponent(q.value.trim());
});
q.focus();
</script>
</body>
</html>
