<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>settings</title>
<link rel="stylesheet" href="./style.css" />
<script src="./app.js"></script>
</head>
<body>
<header>
  <div class="logo" onclick="location.href='./index.html'">HUB</div>
  <nav>
    <button class="nlink" onclick="location.href='./games.html'">games</button>
    <button class="nlink" onclick="location.href='./proxy.html'">proxy</button>
    <button class="nlink" onclick="location.href='./settings.html'">settings</button>
  </nav>
</header>

<div class="settings">
  <div class="setting-group">
    <h3>tab cloak</h3>
    <label>preset</label>
    <select id="cloak">
      <option value="default">hub</option>
      <option value="classroom">google classroom</option>
      <option value="docs">google docs</option>
      <option value="drive">google drive</option>
      <option value="canvas">canvas</option>
      <option value="clever">clever</option>
    </select>
    <label>custom title</label>
    <input type="text" id="ctitle" placeholder="" />
    <label>custom icon url</label>
    <input type="text" id="cicon" placeholder="" />
  </div>

  <div class="setting-group">
    <h3>theme</h3>
    <select id="theme">
      <option value="dark">black</option>
      <option value="light">white</option>
    </select>
  </div>

  <div class="setting-group">
    <h3>stealth</h3>
    <div class="row2">
      <button class="btn" id="blank">open in about:blank</button>
    </div>
    <p class="note">hides the site from history as a game page.</p>
  </div>

  <div class="row2">
    <button class="btn" id="save">save</button>
    <button class="btn" id="reset">reset</button>
  </div>
  <p class="note" id="saved" style="display:none">saved.</p>
</div>

<script>
const s = loadSettings();
document.getElementById('cloak').value = s.cloak || 'default';
document.getElementById('ctitle').value = s.title || '';
document.getElementById('cicon').value = s.icon || '';
document.getElementById('theme').value = s.theme || 'dark';

document.getElementById('save').onclick = () => {
  saveSettings({
    cloak: document.getElementById('cloak').value,
    title: document.getElementById('ctitle').value.trim(),
    icon: document.getElementById('cicon').value.trim(),
    theme: document.getElementById('theme').value
  });
  applySettings();
  const n = document.getElementById('saved');
  n.style.display = 'block';
  setTimeout(() => n.style.display = 'none', 1500);
};
document.getElementById('reset').onclick = () => {
  localStorage.removeItem('hub-settings');
  location.reload();
};
document.getElementById('blank').onclick = () => {
  const w = window.open('about:blank', '_blank');
  if (!w) return;
  w.document.write('<iframe src="' + location.origin + '/index.html" style="position:fixed;inset:0;width:100%;height:100%;border:none"></iframe>');
  w.document.close();
};
</script>
</body>
</html>
